name: CI

on:
    push:
        branches: ["**"]
        paths-ignore: ["**.md"]
    pull_request:
        branches: [master, develop]
        paths-ignore: ["**.md"]

# Um novo push na mesma branch cancela a execução anterior
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Lint, typecheck e build
        runs-on: ubuntu-latest
        timeout-minutes: 15

        # O front não chama a API no build; a URL só é embutida no bundle (NEXT_PUBLIC_*)
        env:
            NEXT_PUBLIC_API_URL: http://localhost:8080
            NEXT_TELEMETRY_DISABLED: 1

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node 24
              uses: actions/setup-node@v5
              with:
                  node-version: "24"
                  cache: npm

            - name: Instalar dependências
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            # Cache incremental do Next.js entre execuções
            - name: Cache do build do Next.js
              uses: actions/cache@v4
              with:
                  path: .next/cache
                  key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
                  restore-keys: |
                      nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

            - name: Build
              run: npm run build
